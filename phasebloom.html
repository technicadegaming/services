function start(){if(panel.classList.contains('show'))return;if(op.mode==='credit'){if(credits<1){beep(170,.15);return}credits--;readout()}runId++;scene='play';paused=false;elapsed=0;hero=-Math.PI/2;score=0;combo=0;multi=1;hp=op.lives;energy=0;inv=0;fireCD=0;spawn=.5;enemySpawn=2;bonusSpawn=9;phase=0;phaseTimer=0;shake=0;orbs=[];enemies=[];bonuses=[];particles=[];floaters=[];rings=[];beep(600,.25)}

function finish(){scene='over';stats.plays++;stats.total+=score;stats.best=Math.max(stats.best,score);stats.top=[...stats.top,score].sort((a,b)=>b-a).slice(0,5);stats.board=stats.board||[];const qualify=stats.board.length<5||score>stats.board[stats.board.length-1].score;save();if(qualify)initials();beep(380,.4);floaters=[];shake=0}
function update(dt){now+=dt;attract+=dt;if(scene!=='play'||paused)return;elapsed+=dt;phaseTimer=Math.max(0,phaseTimer-dt);inv=Math.max(0,inv-dt);fireCD=Math.max(0,fireCD-dt);if(elapsed>=op.seconds||hp<=0){finish();return}let direction=(held.right?1:0)-(held.left?1:0);hero+=direction*3.5*dt;spawn-=dt;enemySpawn-=dt;bonusSpawn-=dt;let wave=1+Math.floor(elapsed/(op.seconds/5));if(spawn<=0&&orbs.length<26){orb();spawn=Math.max(.26,.83-wave*.09)}if(enemySpawn<=0&&enemies.length<14){hazard();enemySpawn=Math.max(.75,2.7-wave*.36)}if(bonusSpawn<=0){spawnBonus();bonusSpawn=rand(10,14)}if(wave!==phase){phase=wave;shake=7;floaters.push({x:W/2,y:H*.33,txt:wave===5?'FINAL WAVE — CHAOS!':'WAVE '+wave+' — GET READY!',color:'#93fcff',life:2});beep(160,.35,'sawtooth',.1,3)}let p=point(hero,radius());for(const o of orbs)o.r-=o.speed*dt;for(const e of enemies)e.r-=e.speed*dt;for(const b of bonuses)b.r-=b.speed*dt;orbs=orbs.filter(o=>{if(o.r<radius()-35)return false;let q=point(o.a,o.r);if(Math.hypot(q.x-p.x,q.y-p.y)<21){hitScore(o.kind==='gold'?240:100,q);burst(q.x,q.y,o.color,15);return false}return true});bonuses=bonuses.filter(b=>{if(b.r<radius()-40)return false;let q=point(b.a,b.r);if(Math.hypot(q.x-p.x,q.y-p.y)<24){collectBonus(b,q);return false}return true});enemies=enemies.filter(e=>{if(e.r<radius()-45)return false;let q=point(e.a,e.r),d=Math.hypot(q.x-p.x,q.y-p.y);if(d<e.size+16&&inv<=0){hp--;inv=1.3;combo=0;multi=1;energy=Math.max(0,energy-20);shake=16;burst(p.x,p.y,'#ff466d',45);floaters.push({x:p.x,y:p.y,txt:'HIT!',life:1,color:'#ff738e'});beep(180,.4,'sawtooth',.12,.2);return false}if(d<e.size+43&&!e.near){e.near=true;score+=75*multi;energy=Math.min(100,energy+8);floaters.push({x:p.x,y:p.y-37,txt:'NEAR MISS +'+75*multi,life:1.2,color:'#ffc4ed'});beep(900,.09)}return true});for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)particles.splice(i,1)}for(let i=floaters.length-1;i>=0;i--){floaters[i].life-=dt;floaters[i].y- '#82f5f0');return}let small=W<650,pad=Math.max(18,W*.035);write('SCORE',pad,55,12,'#a8b9dc','left');write(score.toLocaleString(),pad,86,small?23:33,'#fff','left');write('BEST '+stats.best.toLocaleString(),pad,111,11,'#b0bdd9','left');write('TIME',W/2,50,12,'#a3b7d7');write(String(Math.ceil(op.seconds-elapsed)),W/2,86,small?32:46,elapsed>op.seconds-15?'#ff547b':'#fff');write('WAVE '+Math.min(5,1+Math.floor(elapsed/(op.seconds/5))),W/2,119,13,'#c4b5ff');write('♥'.repeat(hp),W-pad,57,small?18:24,'#ff6493','right');write('×'+multi,W-pad,91,small?23:31,'#ffe082','right');write('CHAIN '+combo,W-pad,116,12,'#a7b9dc','right');let bw=Math.min(300,W*.37),by=H-(small?174:63);g.fillStyle='#233257';g.fillRect(W/2-bw/2,by,bw,11);g.fillStyle=energy>=100?'#ffdc7b':'#49eee6';g.fillRect(W/2-bw/2,by,bw*energy/100,11);write(energy>=100?'SUPER PULSE READY!':'PULSE CHARGE',W/2,by-18,Math.min(14,W*.035),'#d5ecff');if(phaseTimer>0)write('2× SCORE  '+Math.ceil(phaseTimer)+'s',W/2,by-44,16,'#f5aaff');if(paused){g.fillStyle='#050917dd';g.fillRect(0,0,W,H);write('PAUSED',W/2,H*.45,47,'#fff');write('PRESS P TO RESUME',W/2,H*.54,20,'#89f4ec')}}
function loop(ms){let dt=Math.min(.04,(ms-last)/1000||.016);last=ms;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function key(e,down){let k=e.code;if(down&&!e.repeat&&k==='KeyO'){if(panel.classList.contains('show'))hidePanel();else openOperator();return}if(down&&!e.repeat&&k==='Digit5'){credits=Math.min(99,credits+1);readout();beep(920,.13);return}if(panel.classList.contains('show'))return;if(['ArrowLeft','ArrowRight','Space','Enter','KeyA','KeyD','KeyP'].includes(k))e.preventDefault();if(k==='ArrowLeft'||k==='KeyA')held.left=down;if(k==='ArrowRight'||k==='KeyD')held.right=down;if(down&&!e.repeat&&(k==='Space'||k==='Enter'))pulse();if(down&&!e.repeat&&k==='KeyP'&&scene==='play')paused=!paused}
addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));addEventListener('blur',()=>{held.left=held.right=false;if(scene==='play')paused=true});document.querySelectorAll('[data-key]').forEach(b=>{let name=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(name==='pulse')pulse();else held[name]=true});for(const n of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(n,()=>{if(name!=='pulse')held[name]=false})});c.addEventListener('pointerdown',e=>{if(scene!=='play')pulse();else if(e.clientX<W*.32)held.left=true;else if(e.clientX>W*.68)held.right=true;else pulse()});c.addEventListener('pointerup',()=>held.left=held.right=false);
</script></body></html>
