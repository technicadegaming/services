name: Static site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-static-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check static Technicade site routes, anchors and scripts
        run: node scripts/check-static-site.mjs
      - name: Guard staged Guides against premature public launch
        run: node scripts/check-guides-prelaunch.mjs
