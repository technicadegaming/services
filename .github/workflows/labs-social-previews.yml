name: Generate Labs PNG previews
on:
  push:
    branches:
      - main
      - feature/labs-png-previews
      - fix/labs-meta-preview
      - fix/labs-social-png-cache
    paths:
      - '.github/workflows/labs-social-previews.yml'
      - 'scripts/build-labs-social-previews.py'
      - 'assets/labs-labs-share.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install 'cairosvg==2.7.1'
      - name: Generate PNG previews and update metadata
        run: python scripts/build-labs-social-previews.py
      - name: Commit generated previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/labs-*-share.png labs.html would-you-rather.html fake-achievement.html challenge-wheel.html one-more-second.html
          git diff --cached --quiet || (git commit -m 'Generate PNG social previews and link metadata' && git push)
