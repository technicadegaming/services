name: Generate Labs PNG previews
on:
  pull_request:
    paths:
      - '.github/workflows/labs-social-previews.yml'
      - 'scripts/build-labs-social-previews.py'
      - 'assets/labs-*-share.svg'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/labs-social-previews.yml'
      - 'scripts/build-labs-social-previews.py'
      - 'assets/labs-*-share.svg'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install 'cairosvg==2.7.1' 'Pillow>=10,<13'
      - name: Generate PNG previews
        run: python scripts/build-labs-social-previews.py
      - name: Verify repeatability
        run: |
          find assets -name 'labs-*-share.png' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/labs-png-before.sha
          python scripts/build-labs-social-previews.py
          find assets -name 'labs-*-share.png' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/labs-png-after.sha
          diff -u /tmp/labs-png-before.sha /tmp/labs-png-after.sha
      - name: Commit generated previews on main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/labs-*-share.png labs.html would-you-rather.html fake-achievement.html challenge-wheel.html one-more-second.html
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate corrected Labs social preview PNGs'
            git push
          fi
