name: Arcade Empire QA
on:
  pull_request:
    paths:
      - 'arcade-empire.html'
      - 'labs.html'
      - 'scripts/game-studio/**'
      - '.github/workflows/arcade-empire-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arcade-empire-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Arcade Empire source checks
        run: python3 scripts/game-studio/check_arcade_empire.py
