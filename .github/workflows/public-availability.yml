name: Public website availability
on:
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * 1'
permissions:
  contents: read
jobs:
  public-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check DNS, status and redirects without secrets
        run: python3 scripts/check-public-availability.py
